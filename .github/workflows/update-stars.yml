name: Update star counts

# Rewrites the star figures in README.md from the GitHub API.
#
# Why a workflow rather than badges: shields.io's github/stars endpoint
# abbreviates anything over 1000 to "5.2k", whose lowercase k and period sit
# visibly smaller than a run of full-height digits. Its dynamic/json endpoint
# returns the raw number but proxies GitHub's *unauthenticated* API, and
# shields.io's own servers get rate-limited — every badge then renders the word
# "invalid" to visitors. This runs against the repo's own GITHUB_TOKEN, so it
# has an authenticated quota and cannot be throttled by other people's traffic.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite star counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess, sys, pathlib

          readme = pathlib.Path("README.md")
          text = readme.read_text()

          # Matches: | **[Repo](https://github.com/BC-SECURITY/Repo)** | 5,235 |
          row = re.compile(
              r'(\*\*\[[^\]]+\]\(https://github\.com/BC-SECURITY/([A-Za-z0-9._-]+)\)\*\*\s*\|\s*)'
              r'([\d,]+)'
              r'(\s*\|)'
          )

          matches = row.findall(text)
          if not matches:
              sys.exit("no star rows matched - the table format changed, refusing to guess")

          def stars(repo):
              out = subprocess.run(
                  ["gh", "api", f"repos/BC-SECURITY/{repo}", "--jq", ".stargazers_count"],
                  capture_output=True, text=True)
              if out.returncode != 0:
                  sys.exit(f"failed to read stars for {repo}: {out.stderr.strip()}")
              return int(out.stdout.strip())

          changes = []
          def replace(m):
              repo, shown = m.group(2), m.group(3)
              fresh = f"{stars(repo):,}"
              if fresh != shown:
                  changes.append(f"{repo}: {shown} -> {fresh}")
              return m.group(1) + fresh + m.group(4)

          updated = row.sub(replace, text)

          if updated != text:
              readme.write_text(updated)
          print("\n".join(changes) if changes else "no changes")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update star counts"
          git push
